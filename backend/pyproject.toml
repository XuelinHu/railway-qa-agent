[project]
name = "railway-qa-agent-backend"
version = "0.1.0"
description = "FastAPI backend for a bilingual railway RAG assistant"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.16.0",
    "asyncpg>=0.30.0",
    "email-validator>=2.2.0",
    "fastapi>=0.115.0",
    "httpx>=0.28.0",
    "orjson>=3.10.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.8.0",
    "PyJWT>=2.9.0",
    "python-docx>=1.2.0",
    "python-dotenv>=1.1.0",
    "python-multipart>=0.0.20",
    "qdrant-client>=1.14.0",
    "sqlalchemy[asyncio]>=2.0.40",
    "uvicorn[standard]>=0.34.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.26.0",
    "ruff>=0.11.0",
]
rag = [
    "sentence-transformers>=3.3.0",
]
# Optional speech. The web UI uses the browser's own APIs first, so the
# application is fully functional without any of this; installing it enables the
# server-side fallback for browsers that have no speech support (Firefox, for
# instance) -- /api/speech/capabilities reports which half is present.
speech = [
    # Pulls ctranslate2 and onnxruntime; CPU-only is deliberate, the GPU is
    # shared with the model server and usually full.
    "faster-whisper>=1.1.0",
    "edge-tts>=7.0.0",
]
# Password-reset mail. Without it the flow records a request for an
# administrator to action instead of failing.
mail = [
    "aiosmtplib>=3.0.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# This project shares a virtualenv with a ROS 2 installation, whose pytest
# plugins register hooks that only exist for ROS launch tests. Disabling them by
# name is a no-op on machines where they are absent.
addopts = "-p no:launch_ros -p no:launch_testing -p no:ament_xmllint -p no:ament_flake8 -p no:ament_pep257 -p no:ament_copyright -p no:ament_lint"
